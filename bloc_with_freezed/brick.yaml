name: bloc_with_freezed
description: Generate a Bloc with Freezed state and events, including status enum
version: 0.1.0+1
environment:
  mason: ^0.1.1

vars:
  project_name:
    type: string
    description: Name of the project (for imports)
    default: my_app
    prompt: What is the name of your project?
  feature_name:
    type: string
    description: Name of the feature this bloc belongs to (for imports)
    default: example
    prompt: What is the feature name? (e.g., auth, home)
  bloc_name:
    type: string
    description: Bloc class name
    prompt: "Bloc class name (e.g., LoginBloc)"