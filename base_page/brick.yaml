name: base_page
description: Generate a page (Stateless or Stateful) with optional Bloc integration
version: 0.1.0+1
environment:
  mason: ^0.1.1

vars:
  project_name:
    type: string
    description: Name of the project (for imports)
    default: my_app
    prompt: What is the name of your project?
  base_page_name:
    type: string
    description: Name of page
    default: Example
    prompt: What is the name of the page?
  feature_name:
    type: string
    description: Name of the feature this page belongs to (for imports)
    default: example
    prompt: What is the feature name? (e.g., auth, home)
  base_page_type:
    type: boolean
    description: Is the page a StatelessWidget? (true = Stateless, false = Stateful)
    default: true
    prompt: Is the page a StatelessWidget?
  include_bloc:
    type: boolean
    description: Include Bloc (default is true)
    default: true
    prompt: Do you want to include Bloc pattern?
  bloc_name:
    type: string
    description: Name of Bloc
    default: ExampleBloc
    prompt: What is the name of the Bloc?
