name: feature_structure
description: A new brick created with the Mason CLI.
version: 0.1.0+1
environment:
  mason: ^0.1.1
#  * a type (string, number, boolean, enum, array, or list)
#  * an optional short description
#  * an optional default value
#  * an optional list of default values (array only)
#  * an optional prompt phrase used when asking for the variable
#  * a list of values (enums only)
#  * an optional separator (list only)
vars:
  project_name:
    type: string
    description: Name of the project (for imports)
    default: my_app
    prompt: What is the name of your project?
  feature_name:
    type: string
    description: Name of the feature.
    prompt: "Name of the feature"

  include_bloc:
    type: boolean
    default: false
    description: Do you want to include a Bloc?

  bloc_name:
    type: string
    description: Bloc name (only used if Bloc is included)
    prompt: "Bloc class name (e.g., LoginBloc)"

  add_page:
    type: boolean
    default: true
    description: Do you want to include a page?

  page_name:
    type: string
    description: Only used if 'add_page' is true
    prompt: "Page class name (e.g., LoginPage)"

  choose_page_type:
    type: boolean
    default: true
    description: Only used if 'add_page' is true
    prompt: "Is the page a StatelessWidget"

  add_bloc_to_page:
    type: boolean
    default: true
    description: Do you want to add the Bloc to the page?